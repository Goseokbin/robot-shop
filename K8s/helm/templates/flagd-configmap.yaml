apiVersion: v1
kind: ConfigMap
metadata:
  name: flagd-config
  labels:
    service: flagd
data:
  flagd-config.json: |
    {
      "$schema": "https://flagd.dev/schema/v0/flags.json",
      "flags": {
        "scenario-memory-leak": {
          "state": "ENABLED",
          "variants": {
            "true": true,
            "false": false
          },
          "defaultVariant": "false"
        },
        "scenario-pool-exhaustion": {
          "state": "ENABLED",
          "variants": {
            "true": true,
            "false": false
          },
          "defaultVariant": "false"
        },
        "payment-maintenance": {
          "state": "ENABLED",
          "variants": {
            "true": true,
            "false": false
          },
          "defaultVariant": "false"
        }
      }
    }
